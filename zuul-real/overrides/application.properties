### Instance env settings
region=us-east-1
environment=test

### Eureka is NOT used in our prototype (static server lists below)
eureka.name=zuul
eureka.port=7001
eureka.vipAddress=${eureka.name}:${eureka.port}
eureka.preferSameZone=false
eureka.registration.enabled=false
eureka.shouldFetchRegistry=false
eureka.shouldUseDns=false
eureka.validateInstanceId=false
eureka.serviceUrl.default=http://localhost:7001/discovery/v2

### Zuul port (default is 7001)
zuul.server.port.main=7001

### Loading Filters
zuul.filters.packages=com.netflix.zuul.filters.common,\
  com.netflix.zuul.sample.filters,\
  com.netflix.zuul.sample.filters.endpoint,\
  com.netflix.zuul.sample.filters.inbound,\
  com.netflix.zuul.sample.filters.outbound

### Origins = the Node.js services running on Windows (outside Docker),
### so Zuul (inside Docker) reaches them through host.docker.internal.
### If the services later move into this compose, replace with e.g. account-service:5001
account.ribbon.NIWSServerListClassName=com.netflix.loadbalancer.ConfigurationBasedServerList
account.ribbon.listOfServers=host.docker.internal:5001

playback.ribbon.NIWSServerListClassName=com.netflix.loadbalancer.ConfigurationBasedServerList
playback.ribbon.listOfServers=host.docker.internal:5002

# This has to be the last line
@next=application-${environment}.properties
